name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        id: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none lib test tool plugins setup.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Check plugins
        run: bash tool/check_plugins.sh

  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Tidy and download Go modules
        working-directory: ./core
        run: |
          go mod tidy
          go mod download

      - name: Go test and vet
        working-directory: ./core
        run: |
          CGO_ENABLED=0 go test -count=1 -v .
          CGO_ENABLED=0 go vet . ./cmd/...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet -tags=with_gvisor . ./mobile ./tun ./platform
          GOOS=linux go vet ./platform

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Gradle wrapper
        run: |
          flutter precache
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          if [ -d "$wrapper" ]; then
            echo "Found gradle wrapper at $wrapper"
          else
            echo "Gradle wrapper not found at $wrapper"
            find "$FLUTTER_ROOT" -name "gradle-wrapper.jar" 2>/dev/null | head -5 || true
            echo "::error::Gradle wrapper not found"
            exit 1
          fi

      - name: Run Android unit tests
        working-directory: ./android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which java))))"
          export FLUTTER_ROOT="$(dirname $(dirname $(which flutter)))"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug \
            --stacktrace --info

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Flutter build Linux debug
        run: flutter build linux --debug

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Flutter build Windows debug
        run: flutter build windows --debug

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Flutter build macOS debug
        run: flutter build macos --debug

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Rust fmt check
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Rust test
        run: cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Windows helper test (default)
        run: cargo test --manifest-path services/helper/Cargo.toml

      - name: Windows helper test (windows-service feature)
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service
