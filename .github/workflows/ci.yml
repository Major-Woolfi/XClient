name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Changelog verify
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Check plugins
        run: bash tool/check_plugins.sh

  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go test and vet
        working-directory: ./core
        run: |
          CGO_ENABLED=0 go test .
          CGO_ENABLED=0 go vet . ./cmd/...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet -tags=with_gvisor . ./mobile ./tun ./platform

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6

      - name: Run Android unit tests
        working-directory: ./android
        run: |
          export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which java))))"
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Enable hooks
        run: yq -i '.hooks.user_defines.setup.build_assets = true' pubspec.yaml

      - name: Flutter build Linux debug
        run: flutter build linux --debug

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install yq
        run: choco install yq -y

      - name: Enable hooks
        run: yq -i '.hooks.user_defines.setup.build_assets = true' pubspec.yaml

      - name: Flutter build Windows debug
        run: flutter build windows --debug

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install yq
        run: brew install yq

      - name: Enable hooks
        run: yq -i '.hooks.user_defines.setup.build_assets = true' pubspec.yaml

      - name: Flutter build macOS debug
        run: flutter build macos --debug

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Rust fmt check
        run: cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Rust test
        run: cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Windows helper test (default)
        run: cargo test --manifest-path services/helper/Cargo.toml

      - name: Windows helper test (windows-service feature)
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service
